version: "3"

tasks:
  dev:
    desc: Start the Tauri dev server with hot reload
    cmds:
      - pnpm tauri dev

  build:
    desc: Build the release bundle
    cmds:
      - pnpm tauri build

  lint:
    desc: Check formatting and lints across the frontend and the Rust crate
    cmds:
      - pnpm lint
      - pnpm typecheck
      - cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  format:
    desc: Apply formatting and safe lint fixes
    cmds:
      - pnpm format
      - cargo fmt --manifest-path src-tauri/Cargo.toml

  test:
    desc: Run unit tests across the Rust workspace
    dir: src-tauri
    cmds:
      - cargo test

  audit:
    desc: Check dependencies for advisories, licenses and banned crates
    cmds:
      - cargo deny --manifest-path src-tauri/Cargo.toml check
      - pnpm audit --prod --audit-level=high

  hooks:
    desc: Install the pre-commit and commit-msg hooks
    cmds:
      - pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg
